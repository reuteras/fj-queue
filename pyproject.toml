[project]
name = "fj-queue"
version = "0.2.0"
description = "Forgejo Actions runner & CI queue dashboard"
requires-python = ">=3.11"
dependencies = ["httpx", "rich"]

# `uvx --from git+https://github.com/reuteras/fj-queue fj-queue`
[project.scripts]
fj-queue = "fj_queue:cli"

# PEP-735 dev dependency group. Pinned so the test suite reproduces
# byte-for-byte across machines. `rich` and `httpx` are duplicated here
# (they are already in [project].dependencies) because some test files
# import them directly and `uv run --group dev pytest tests/` resolves
# the dev group as a standalone environment.
[dependency-groups]
dev = ["jsonschema", "mypy", "pytest", "respx", "ruff", "syrupy"]

# Surface fj_queue.py as a top-level module so `pytest tests/` and
# `python -c "import fj_queue"` both work from the scripts/fj-queue/
# directory without extra PYTHONPATH plumbing.
[tool.setuptools]
py-modules = ["fj_queue"]
# Ship the JSON Schema with installed copies (uvx / uv tool install) so
# `--schema` works outside a checkout; load_schema() looks here second.
data-files = { "share/fj-queue/schema" = ["schema/fj-queue.v1.json"] }

# jsonschema ships no type stubs; it is only used by the contract tests.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
