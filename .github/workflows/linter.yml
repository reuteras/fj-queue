---
## Super Linter GitHub Actions ##
name: Lint Code Base

# Start the job on all push #
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

# Set the Job #
jobs:
  build:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest

    # Load all steps #
    steps:
      # Checkout the code base #
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Run Linter against code base #
      - name: Lint Code Base
        # yamllint disable-line rule:line-length
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # Use the repo's markdownlint config (same as pre-commit).
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          # mypy would run here without the project's dependencies (httpx,
          # rich, pytest, ...); the dependency-aware check is the lint job
          # in test.yml.
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          # Our pre-commit hooks run ruff/mypy via `uv run`, which is not
          # available in the super-linter container; ruff/mypy run in
          # test.yml and gitleaks/markdownlint run as super-linter linters.
          VALIDATE_PRE_COMMIT: false
          # Super-linter runs ruff with its own template config, ignoring
          # pyproject.toml; ruff runs with the project config in test.yml.
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          VALIDATE_SPELL_CODESPELL: false
          VALIDATE_YAML_PRETTIER: false
