---
repos:
  # ruff and mypy run from the project's uv environment so their versions
  # come from uv.lock (the same versions CI uses in test.yml).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen --group dev mypy fj_queue.py tests
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # v1.9.0
    hooks:
      - id: betterleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # v0.50.0
    hooks:
      - id: markdownlint
